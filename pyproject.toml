[project]
name = "modelcard"
version = "0.1.0"
description = "Generate a deterministic Markdown model card from a trained scikit-learn estimator, eval metrics, and dataset metadata."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scikit-learn>=1.4",
    "numpy>=1.26",
]

[project.scripts]
modelcard = "modelcard.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
